<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏王卡组综合工具 - dRcLoD的博客</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .tool-card {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 8px;
    padding: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    margin-bottom: 20px;
  }
  .tool-card h2 {
    font-size: 20px;
    color: #1a1a1a;
    margin-bottom: 18px;
    padding-left: 12px;
    border-left: 4px solid #667eea;
    display: flex;
    align-items: center;
  }
  .tool-row {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
  }
  .tool-row:last-child { margin-bottom: 0; }
  .tool-label {
    width: 140px;
    color: #4b5563;
    font-size: 14px;
    margin-right: 10px;
    flex-shrink: 0;
  }
  .tool-input, .tool-file {
    flex: 1;
    padding: 9px 14px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    background: #fff;
    transition: all 0.3s ease;
  }
  .tool-input:focus, .tool-file:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
  }
  .tool-suffix {
    margin-left: 10px;
    color: #8590a6;
    font-size: 13px;
  }
  .tool-radio-group {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .tool-radio-group label {
    display: flex;
    align-items: center;
    cursor: pointer;
    font-size: 14px;
    color: #333;
    padding: 8px 18px;
    border-radius: 20px;
    border: 1px solid #e0e0e0;
    background: #fff;
    transition: all 0.3s ease;
  }
  .tool-radio-group label:hover {
    border-color: #667eea;
    box-shadow: 0 2px 10px rgba(102, 126, 234, 0.2);
  }
  .tool-radio-group input { margin-right: 8px; }
  .tool-radio-group label:has(input:checked) {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border-color: transparent;
  }
  .tool-btn {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    padding: 10px 28px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-right: 12px;
  }
  .tool-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
  }
  .tool-btn:disabled {
    background: #c0c0c0;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .tool-btn-stop {
    background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
  }
  .tool-btn-stop:hover {
    box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
  }
  .progress-wrap {
    height: 12px;
    background: #e0e0e0;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 18px;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    width: 0;
    transition: width 0.3s ease;
    border-radius: 8px;
  }
  .log-box {
    background: #f9fafb;
    border-radius: 8px;
    padding: 14px;
    height: 200px;
    overflow-y: auto;
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
  }
  .log-box div { margin-bottom: 2px; }
  .deck-section { margin-bottom: 18px; }
  .deck-section:last-child { margin-bottom: 0; }
  .deck-section h3 {
    font-size: 15px;
    color: #1a1a1a;
    margin-bottom: 10px;
    padding-left: 10px;
    border-left: 3px solid #667eea;
  }
  .deck-section h3.extra-h { border-left-color: #a855f7; }
  .deck-section h3.side-h { border-left-color: #f59e0b; }
  .deck-grid { display: flex; flex-wrap: wrap; }
  .card-badge {
    display: inline-block;
    padding: 5px 12px;
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.12) 0%, rgba(118, 75, 162, 0.12) 100%);
    border: 1px solid rgba(102, 126, 234, 0.3);
    border-radius: 16px;
    font-size: 13px;
    color: #4a4a8a;
    margin: 3px;
    transition: all 0.3s ease;
  }
  .card-badge:hover {
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
    transform: translateY(-1px);
  }
  .card-badge.extra {
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.12) 0%, rgba(99, 102, 241, 0.12) 100%);
    border-color: rgba(168, 85, 247, 0.3);
    color: #5b21b6;
  }
  .card-badge.side {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.12) 0%, rgba(239, 68, 68, 0.12) 100%);
    border-color: rgba(245, 158, 11, 0.3);
    color: #9a3412;
  }
  .tool-tip { color: #8590a6; font-size: 14px; }
  .hidden { display: none !important; }
  @media (max-width: 768px) {
    .tool-row { flex-direction: column; align-items: flex-start; }
    .tool-label { width: auto; margin-bottom: 6px; margin-right: 0; }
  }
</style>
</head>
<body>

<div class="container">
  <aside class="sidebar">
    <div class="user-card">
      <img class="avatar" src="../image/touxiang.jpg" alt="头像">
      <h1 class="username">dRcLoD</h1>
      <p class="signature">是否需要写下什么证明这里存在过什么</p>
      <nav class="nav-buttons">
        <a href="../index.html" class="nav-btn">首页</a>
        <a href="../text/about.html" class="nav-btn">关于</a>
        <a href=".\document\index.html" class="nav-btn">资料下载</a>
        <a href="https://space.bilibili.com/293534745" class="nav-btn">B站首页</a>
      </nav>
      <div class="visitor-counter">
        <span>👁 访客数: </span><span id="busuanzi_value_site_uv">--</span>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-title">
      <h1>游戏王卡组综合工具</h1>
      <p>卡组展示 / 随机抽卡 / 双卡组对决模拟</p>
    </div>

    <div class="tool-card">
      <h2>功能模式</h2>
      <div class="tool-radio-group">
        <label><input type="radio" name="mode" value="single" checked>单卡组统计 + 随机抽卡</label>
        <label><input type="radio" name="mode" value="battle">双卡组对决模拟</label>
      </div>
    </div>

    <div class="tool-card">
      <h2>文件设置</h2>
      <div id="singleFileArea">
        <div class="tool-row">
          <span class="tool-label">选择YDK文件：</span>
          <input type="file" id="ydkFileSingle" accept=".ydk" class="tool-file">
        </div>
      </div>
      <div id="battleFileArea" class="hidden">
        <div class="tool-row">
          <span class="tool-label">卡组A（YDK）：</span>
          <input type="file" id="ydkFileA" accept=".ydk" class="tool-file">
        </div>
        <div class="tool-row">
          <span class="tool-label">卡组B（YDK）：</span>
          <input type="file" id="ydkFileB" accept=".ydk" class="tool-file">
        </div>
      </div>
      <div class="tool-row">
        <span class="tool-label">CSV保存名称：</span>
        <input type="text" id="excelName" value="卡组综合结果" class="tool-input">
        <span class="tool-suffix">.csv</span>
      </div>
      <div id="singleParams">
        <div class="tool-row">
          <span class="tool-label">抽取次数：</span>
          <input type="number" id="drawTimes" value="1" min="1" max="100" class="tool-input">
          <span class="tool-suffix">轮</span>
        </div>
        <div class="tool-row">
          <span class="tool-label">每次抽取张数：</span>
          <input type="number" id="drawCount" value="5" min="1" max="60" class="tool-input">
          <span class="tool-suffix">张/轮</span>
        </div>
      </div>
      <div id="battleParams" class="hidden">
        <div class="tool-row">
          <span class="tool-label">对决次数：</span>
          <input type="number" id="battleTimes" value="1" min="1" max="100" class="tool-input">
          <span class="tool-suffix">次（双方各抽5张+先攻额外1张）</span>
        </div>
      </div>
    </div>

    <div class="tool-card">
      <h2>卡组展示（主 / 副 / 额外）</h2>
      <div id="deckDisplaySingle"></div>
      <div id="deckDisplayA" class="hidden">
        <div class="deck-section"><h3>卡组A</h3></div>
        <div id="deckDisplayAInner"></div>
      </div>
      <div id="deckDisplayB" class="hidden">
        <div class="deck-section"><h3>卡组B</h3></div>
        <div id="deckDisplayBInner"></div>
      </div>
      <p id="displayTip" class="tool-tip">选择YDK文件后将自动展示卡组内容...</p>
    </div>

    <div class="tool-card">
      <h2>操作</h2>
      <div>
        <button id="startBtn" class="tool-btn">开始执行</button>
        <button id="stopBtn" class="tool-btn tool-btn-stop" disabled>停止</button>
      </div>
      <div class="progress-wrap">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>

    <div class="tool-card">
      <h2>操作日志</h2>
      <div id="logContainer" class="log-box"></div>
    </div>

    <div class="footer">
      <p>© 2026 dRcLoD | 卡组综合工具</p>
    </div>
  </main>
</div>

<div class="music-player">
  <div class="music-toggle" onclick="toggleMusic()">🎵</div>
  <div class="music-panel" id="music-panel">
    <iframe frameborder="no" border="0" marginwidth="0" marginheight="0" width=330 height=450 src="https://music.163.com/outchain/player?type=0&id=4970305981&auto=0&height=430"></iframe>
  </div>
</div>

<script>
    const CACHE = {};
    let isRunning = false;
    let abortController = null;
    let parsedDeckSingle = null;
    let parsedDeckA = null;
    let parsedDeckB = null;
    const ydkFileSingleInput = document.getElementById('ydkFileSingle');
    const ydkFileAInput = document.getElementById('ydkFileA');
    const ydkFileBInput = document.getElementById('ydkFileB');
    const excelNameInput = document.getElementById('excelName');
    const drawTimesInput = document.getElementById('drawTimes');
    const drawCountInput = document.getElementById('drawCount');
    const battleTimesInput = document.getElementById('battleTimes');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const progressBar = document.getElementById('progressBar');
    const logContainer = document.getElementById('logContainer');
    const singleFileArea = document.getElementById('singleFileArea');
    const battleFileArea = document.getElementById('battleFileArea');
    const singleParams = document.getElementById('singleParams');
    const battleParams = document.getElementById('battleParams');
    const deckDisplaySingle = document.getElementById('deckDisplaySingle');
    const deckDisplayA = document.getElementById('deckDisplayA');
    const deckDisplayB = document.getElementById('deckDisplayB');
    const deckDisplayAInner = document.getElementById('deckDisplayAInner');
    const deckDisplayBInner = document.getElementById('deckDisplayBInner');
    const displayTip = document.getElementById('displayTip');
    log("工具已就绪，请选择模式与YDK文件");
    function log(msg) {
        const time = new Date().toLocaleTimeString();
        const logItem = document.createElement('div');
        logItem.textContent = `[${time}] ${msg}`;
        logContainer.appendChild(logItem);
        logContainer.scrollTop = logContainer.scrollHeight;
    }
    function setRunning(running) {
        isRunning = running;
        startBtn.disabled = running;
        stopBtn.disabled = !running;
        if (!running) progressBar.style.width = '0%';
        else progressBar.style.width = '10%';
    }
    document.querySelectorAll('input[name="mode"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
            const mode = e.target.value;
            if (mode === 'single') {
                singleFileArea.classList.remove('hidden');
                battleFileArea.classList.add('hidden');
                singleParams.classList.remove('hidden');
                battleParams.classList.add('hidden');
                deckDisplaySingle.classList.remove('hidden');
                deckDisplayA.classList.add('hidden');
                deckDisplayB.classList.add('hidden');
            } else {
                singleFileArea.classList.add('hidden');
                battleFileArea.classList.remove('hidden');
                singleParams.classList.add('hidden');
                battleParams.classList.remove('hidden');
                deckDisplaySingle.classList.add('hidden');
                deckDisplayA.classList.remove('hidden');
                deckDisplayB.classList.remove('hidden');
            }
        });
    });
    ydkFileSingleInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        displayTip.classList.add('hidden');
        deckDisplaySingle.innerHTML = '';
        log(`已选择YDK文件：${file.name}`);
        try {
            const text = await readFileAsText(file);
            parsedDeckSingle = parseYdkFile(text);
            log(`解析完成 - 主卡组：${parsedDeckSingle.main.length}张，额外：${parsedDeckSingle.extra.length}张，副卡组：${parsedDeckSingle.side.length}张`);
            await displayDeck(parsedDeckSingle, deckDisplaySingle);
        } catch (err) {
            log(`解析失败：${err.message}`);
        }
    });
    ydkFileAInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        displayTip.classList.add('hidden');
        deckDisplayAInner.innerHTML = '';
        log(`已选择卡组A：${file.name}`);
        try {
            const text = await readFileAsText(file);
            parsedDeckA = parseYdkFile(text);
            log(`卡组A解析完成 - 主：${parsedDeckA.main.length}，额外：${parsedDeckA.extra.length}，副：${parsedDeckA.side.length}`);
            await displayDeck(parsedDeckA, deckDisplayAInner);
        } catch (err) {
            log(`卡组A解析失败：${err.message}`);
        }
    });
    ydkFileBInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        deckDisplayBInner.innerHTML = '';
        log(`已选择卡组B：${file.name}`);
        try {
            const text = await readFileAsText(file);
            parsedDeckB = parseYdkFile(text);
            log(`卡组B解析完成 - 主：${parsedDeckB.main.length}，额外：${parsedDeckB.extra.length}，副：${parsedDeckB.side.length}`);
            await displayDeck(parsedDeckB, deckDisplayBInner);
        } catch (err) {
            log(`卡组B解析失败：${err.message}`);
        }
    });
    function readFileAsText(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = () => reject(new Error('文件读取失败'));
            reader.readAsText(file, 'utf-8');
        });
    }
    function parseYdkFile(text) {
        const main = [];
        const extra = [];
        const side = [];
        let currentSection = null;
        const lines = text.split('\n');
        for (const line of lines) {
            const cleanLine = line.trim();
            if (!cleanLine || (cleanLine.startsWith('#') && !['#main', '#extra'].includes(cleanLine))) {
                continue;
            }
            if (cleanLine === '#main') { currentSection = 'main'; continue; }
            if (cleanLine === '#extra') { currentSection = 'extra'; continue; }
            if (cleanLine === '!side') { currentSection = 'side'; continue; }
            if (/^\d+$/.test(cleanLine)) {
                if (currentSection === 'main') main.push(cleanLine);
                else if (currentSection === 'extra') extra.push(cleanLine);
                else if (currentSection === 'side') side.push(cleanLine);
            }
        }
        return { main, extra, side };
    }
    function countCards(cardList) {
        const counter = {};
        for (const code of cardList) counter[code] = (counter[code] || 0) + 1;
        return counter;
    }
    function getOrderedItems(counter, originalList) {
        const ordered = [];
        const seen = new Set();
        for (const code of originalList) {
            if (!seen.has(code)) {
                ordered.push([code, counter[code]]);
                seen.add(code);
            }
        }
        return ordered;
    }
    async function getCardName(cardCode) {
        if (CACHE[cardCode]) return CACHE[cardCode];
        abortController = new AbortController();
        try {
            log(`正在获取卡牌 ${cardCode} 名称...`);
            const response = await fetch(`https://ygocdb.com/api/v0/card/${cardCode}`, {
                method: 'GET',
                headers: { 'Accept': 'application/json' },
                signal: abortController.signal
            });
            if (!response.ok) throw new Error(`HTTP错误：${response.status}`);
            const cardData = await response.json();
            let cardName = cardCode;
            if (cardData && cardData.text && cardData.text.name) {
                cardName = cardData.text.name.trim();
                log(`成功获取卡牌 ${cardCode}：${cardName}`);
            } else {
                log(`未找到卡牌 ${cardCode} 的名称信息`);
            }
            CACHE[cardCode] = cardName;
            return cardName;
        } catch (error) {
            if (error.name !== 'AbortError') {
                log(`获取卡牌 ${cardCode} 失败：${error.message}`);
            }
            CACHE[cardCode] = cardCode;
            return cardCode;
        }
    }
    async function getCardsWithNames(cardList) {
        const result = [];
        for (const [code, count] of cardList) {
            if (!isRunning) break;
            const name = await getCardName(code);
            result.push([name, count]);
        }
        return result;
    }
    async function displayDeck(deckData, container) {
        container.innerHTML = '';
        const sections = [
            { title: '主卡组', cards: deckData.main, cls: '', hCls: '' },
            { title: '额外卡组', cards: deckData.extra, cls: 'extra', hCls: 'extra-h' },
            { title: '副卡组', cards: deckData.side, cls: 'side', hCls: 'side-h' }
        ];
        for (const sec of sections) {
            const counter = countCards(sec.cards);
            const ordered = getOrderedItems(counter, sec.cards);
            const sectionEl = document.createElement('div');
            sectionEl.className = 'deck-section';
            const titleEl = document.createElement('h3');
            if (sec.hCls) titleEl.className = sec.hCls;
            titleEl.textContent = `${sec.title}（共${sec.cards.length}张，${ordered.length}种）`;
            sectionEl.appendChild(titleEl);
            const gridEl = document.createElement('div');
            gridEl.className = 'deck-grid';
            if (ordered.length === 0) {
                const empty = document.createElement('span');
                empty.className = 'tool-tip';
                empty.textContent = '（空）';
                gridEl.appendChild(empty);
            }
            for (const [code, count] of ordered) {
                const name = await getCardName(code);
                const badge = document.createElement('span');
                badge.className = `card-badge ${sec.cls}`;
                badge.textContent = count > 1 ? `${name} ×${count}` : name;
                gridEl.appendChild(badge);
            }
            sectionEl.appendChild(gridEl);
            container.appendChild(sectionEl);
        }
    }
    startBtn.addEventListener('click', async () => {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        if (mode === 'single') {
            await runSingleMode();
        } else {
            await runBattleMode();
        }
    });
    stopBtn.addEventListener('click', () => {
        isRunning = false;
        if (abortController) abortController.abort();
        stopBtn.disabled = true;
        startBtn.disabled = false;
        progressBar.style.width = '0%';
        log('用户手动停止');
    });
    async function runSingleMode() {
        const file = ydkFileSingleInput.files[0];
        if (!file) { alert('请先选择YDK文件！'); return; }
        if (!parsedDeckSingle) { alert('请先选择有效的YDK文件！'); return; }
        if (parsedDeckSingle.main.length === 0) { alert('主卡组为空，无法抽卡！'); return; }
        const drawTimes = parseInt(drawTimesInput.value);
        const drawCount = parseInt(drawCountInput.value);
        if (isNaN(drawTimes) || drawTimes < 1 || drawTimes > 100) { alert('请输入有效的抽取次数（1-100）！'); return; }
        if (isNaN(drawCount) || drawCount < 1 || drawCount > 60) { alert('请输入有效的每次抽取张数（1-60）！'); return; }
        if (drawCount > parsedDeckSingle.main.length) { alert(`每次抽取张数不能超过主卡组数量（${parsedDeckSingle.main.length}张）！`); return; }
        setRunning(true);
        log(`=== 开始单卡组抽卡模拟 ===`);
        log(`抽取次数：${drawTimes}轮，每轮${drawCount}张`);
        try {
            const { main, extra, side } = parsedDeckSingle;
            log('统计卡牌出现次数...');
            const mainOrdered = getOrderedItems(countCards(main), main);
            const extraOrdered = getOrderedItems(countCards(extra), extra);
            const sideOrdered = getOrderedItems(countCards(side), side);
            log('获取卡牌名称（用于统计）...');
            const mainWithNames = await getCardsWithNames(mainOrdered);
            const extraWithNames = await getCardsWithNames(extraOrdered);
            const sideWithNames = await getCardsWithNames(sideOrdered);
            if (!isRunning) return;
            progressBar.style.width = '40%';
            log(`开始随机抽卡（${drawTimes}轮，每轮${drawCount}张）...`);
            const drawResults = await randomDrawCards(main, drawTimes, drawCount);
            if (!isRunning) return;
            progressBar.style.width = '90%';
            log('生成CSV文件...');
            generateSingleCSV(mainWithNames, extraWithNames, sideWithNames, drawResults, drawCount);
            log('=== 完成！ ===');
            alert(`完成！\n文件已下载：${excelNameInput.value}.csv`);
        } catch (error) {
            log(`失败：${error.message}`);
            alert(`失败：${error.message}`);
        } finally {
            setRunning(false);
        }
    }
    async function randomDrawCards(mainDeckCodes, drawTimes, drawCount) {
        const results = [];
        const deck = [...mainDeckCodes];
        for (let i = 1; i <= drawTimes; i++) {
            if (!isRunning) break;
            const shuffled = [...deck].sort(() => Math.random() - 0.5);
            const drawnCodes = shuffled.slice(0, drawCount);
            const drawnNames = [];
            for (const code of drawnCodes) {
                const name = await getCardName(code);
                drawnNames.push(name);
            }
            results.push([i, ...drawnNames]);
            log(`第${i}轮抽卡结果：${drawnNames.join(' | ')}`);
            const progress = 40 + (i / drawTimes) * 50;
            progressBar.style.width = `${progress}%`;
        }
        return results;
    }
    function generateSingleCSV(main, extra, side, drawResults, drawCount) {
        const data = [];
        const header = ['主卡组-卡名', '主卡组-数量', '额外卡组-卡名', '额外卡组-数量', '副卡组-卡名', '副卡组-数量', '抽卡序号'];
        for (let j = 1; j <= drawCount; j++) header.push(`第${j}张`);
        data.push(header);
        const maxRows = Math.max(main.length, extra.length, side.length, drawResults.length);
        for (let i = 0; i < maxRows; i++) {
            const row = [];
            row.push(main[i] ? main[i][0] : '');
            row.push(main[i] ? main[i][1] : '');
            row.push(extra[i] ? extra[i][0] : '');
            row.push(extra[i] ? extra[i][1] : '');
            row.push(side[i] ? side[i][0] : '');
            row.push(side[i] ? side[i][1] : '');
            if (drawResults[i]) {
                row.push(drawResults[i][0]);
                for (let j = 1; j <= drawCount; j++) {
                    row.push(drawResults[i][j] || '');
                }
            } else {
                row.push('');
            }
            data.push(row);
        }
        downloadCSV(data, `${excelNameInput.value.trim() || '卡组综合结果'}.csv`);
    }
    async function runBattleMode() {
        const fileA = ydkFileAInput.files[0];
        const fileB = ydkFileBInput.files[0];
        if (!fileA || !fileB) { alert('请选择两个YDK卡组文件！'); return; }
        if (!parsedDeckA || !parsedDeckB) { alert('请先选择有效的YDK文件！'); return; }
        if (parsedDeckA.main.length === 0 || parsedDeckB.main.length === 0) { alert('主卡组为空，无法对决！'); return; }
        const battleTimes = parseInt(battleTimesInput.value);
        if (isNaN(battleTimes) || battleTimes < 1 || battleTimes > 100) { alert('请输入有效的对决次数（1-100）！'); return; }
        setRunning(true);
        log(`=== 开始卡组对决模拟 ===`);
        log(`卡组A：${fileA.name}`);
        log(`卡组B：${fileB.name}`);
        log(`对决次数：${battleTimes}次`);
        try {
            const battleResults = [];
            for (let i = 1; i <= battleTimes; i++) {
                if (!isRunning) break;
                log(`\n--- 第${i}次对决 ---`);
                const result = await simulateBattle(i, parsedDeckA.main, parsedDeckB.main);
                battleResults.push(result);
                const progress = 30 + (i / battleTimes) * 60;
                progressBar.style.width = `${progress}%`;
            }
            if (!isRunning) return;
            progressBar.style.width = '95%';
            log('生成CSV结果文件...');
            generateBattleCSV(battleResults);
            log('=== 对决模拟完成！ ===');
            alert(`完成！共${battleResults.length}次对决\n文件已下载：${excelNameInput.value}.csv`);
        } catch (error) {
            log(`失败：${error.message}`);
            alert(`失败：${error.message}`);
        } finally {
            setRunning(false);
        }
    }
    async function drawCards(deck, count) {
        const shuffled = [...deck].sort(() => Math.random() - 0.5);
        const drawnCodes = shuffled.slice(0, count);
        const drawnNames = [];
        for (const code of drawnCodes) {
            const name = await getCardName(code);
            drawnNames.push(name);
        }
        return drawnNames;
    }
    async function simulateBattle(battleNum, deckA, deckB) {
        const firstAttackerIsA = Math.random() > 0.5;
        const firstAttacker = firstAttackerIsA ? '卡组A' : '卡组B';
        const secondAttacker = firstAttackerIsA ? '卡组B' : '卡组A';
        log(`先攻方：${firstAttacker}`);
        log(`正在抽取${firstAttacker}初始手牌（5张）...`);
        const firstDraw5 = await drawCards(firstAttackerIsA ? deckA : deckB, 5);
        log(`${firstAttacker}初始手牌：${firstDraw5.join(' | ')}`);
        log(`正在抽取${secondAttacker}初始手牌（5张）...`);
        const secondDraw5 = await drawCards(firstAttackerIsA ? deckB : deckA, 5);
        log(`${secondAttacker}初始手牌：${secondDraw5.join(' | ')}`);
        log(`正在抽取${firstAttacker}额外抽卡（1张）...`);
        const firstDraw1 = await drawCards(firstAttackerIsA ? deckA : deckB, 1);
        log(`${firstAttacker}额外抽卡：${firstDraw1[0]}`);
        return {
            battleNum,
            firstAttacker: firstAttackerIsA ? 'A' : 'B',
            deckA: {
                draw5: firstAttackerIsA ? firstDraw5 : secondDraw5,
                draw1: firstAttackerIsA ? firstDraw1[0] : ''
            },
            deckB: {
                draw5: firstAttackerIsA ? secondDraw5 : firstDraw5,
                draw1: firstAttackerIsA ? '' : firstDraw1[0]
            }
        };
    }
    function generateBattleCSV(battleResults) {
        const data = [
            ['对决次数', '先攻方', '卡组A-初始5张', '卡组A-额外1张', '卡组B-初始5张', '卡组B-额外1张'],
            ['', '', '(卡1|卡2|卡3|卡4|卡5)', '(单独抽卡)', '(卡1|卡2|卡3|卡4|卡5)', '(单独抽卡)']
        ];
        battleResults.forEach(result => {
            data.push([
                result.battleNum,
                result.firstAttacker,
                result.deckA.draw5.join(' | '),
                result.deckA.draw1 || '-',
                result.deckB.draw5.join(' | '),
                result.deckB.draw1 || '-'
            ]);
        });
        downloadCSV(data, `${excelNameInput.value.trim() || '卡组综合结果'}.csv`);
    }
    function downloadCSV(data, filename) {
        const csv = data.map(row =>
            row.map(cell => {
                const s = String(cell == null ? '' : cell);
                if (s.includes(',') || s.includes('"') || s.includes('\n')) {
                    return '"' + s.replace(/"/g, '""') + '"';
                }
                return s;
            }).join(',')
        ).join('\n');
        const bom = '\uFEFF';
        const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>
