<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dRcLoD的博客开站公告 - dRcLoD的博客</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">
  <aside class="sidebar">
    <div class="user-card">
      <img class="avatar" src="../image/touxiang.jpg" alt="头像">
      <h1 class="username">dRcLoD</h1>
      <p class="signature">是否需要写下什么证明这里存在过什么</p>
      <nav class="nav-buttons">
        <a href="../index.html" class="nav-btn">首页</a>
        <a href="about.html" class="nav-btn">关于</a>
        <a href=".\document\index.html" class="nav-btn">资料下载</a>
        <a href="https://space.bilibili.com/293534745" class="nav-btn">B站首页</a>
      </nav>
      <div class="visitor-counter">
        <span>👁 访客数: </span><span id="visitor-count">--</span>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="article-header">
      <a href="../index.html" class="back-btn">← 返回首页</a>
      <span class="article-tag" id="article-tag">公告</span>
      <h1 class="article-title" id="article-title">dRcLoD的博客公告</h1>
      <div class="article-meta">
        <span class="article-date" id="article-date">2026-08-11</span>
        <span class="article-author">dRcLoD</span>
      </div>
    </div>

    <article class="article-content" id="article-content">
      <h1 class="article-title" id="article-title"> 2026.08.05</h1>
      <p >本站算是正式开站了</p>
      <h1 class="article-title" id="article-title"> 2026.08.11功能更新</h1>
      <p>本站增加了文件下载功能</p>
    </article>

    <div class="footer">
      <p>© 2026 dRcLoD | 用文字记录生活</p>
    </div>
  </main>
</div>

<div class="music-player">
  <div class="music-toggle" onclick="toggleMusic()">🎵</div>
  <div class="music-panel" id="music-panel">
    <iframe frameborder="no" border="0" marginwidth="0" marginheight="0" width=330 height=450 src="https://music.163.com/outchain/player?type=0&id=4970305981&auto=0&height=430"></iframe>
  </div>
</div>

<script>
function toggleMusic() {
  document.getElementById('music-panel').classList.toggle('active');
}

fetch('https://t.alcy.cc/json?pc=1')
  .then(res => res.json())
  .then(data => {
    if (data.code === 200 && data.data.link) {
      document.body.style.backgroundImage = `url(${data.data.link})`;
    }
  })
  .catch(err => console.log('背景加载失败:', err));

fetch('https://api.counterapi.dev/v1/dRcLoD/site/count')
  .then(res => res.json())
  .then(data => {
    document.getElementById('visitor-count').textContent = data.count;
  })
  .catch(err => console.log('访客数加载失败:', err));
</script>
</body>
</html>
